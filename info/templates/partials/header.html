{% load static %}

<header class="site-header">
  <div class="header-inner">

    <!-- LOGO -->
    <a href="/" class="brand" aria-label="Emertat Farabar Home">
      <img
        src="{% static 'info/images/logo2.png' %}"
        alt="Emertat Farabar International Freight Forwarding"
      >
    </a>

    <!-- MOBILE BUTTON -->
    <button
      class="hamburger-menu"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="main-nav"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- NAVIGATION -->
    <nav id="main-nav" class="main-nav" aria-label="Main navigation">
      <ul>

        <li>
          <a href="/">Home</a>
        </li>

        <!-- SERVICES DROPDOWN -->
        <li class="nav-dropdown">
          <button class="dropdown-toggle" type="button">
            Services
            <span class="dropdown-arrow">⌄</span>
          </button>

          <div class="dropdown-menu">
            <a href="/services/road-freight/">Road Freight</a>
            <a href="/services/sea-freight/">Sea Freight</a>
            <a href="/services/rail-freight/">Rail Freight</a>
            <a href="/services/multimodal-transport/">Multimodal Transport</a>
            <a href="/services/customs-clearance/">Customs Clearance</a>
          </div>
        </li>

        <li>
          <a href="/#cargo-solutions">Cargo & Industries</a>
        </li>

        <li>
          <a href="/about/">About</a>
        </li>

        <li>
          <a href="/team/">Team</a>
        </li>

        <li>
          <a href="/contact/">Contact</a>
        </li>

      </ul>
    </nav>

    <!-- CTA -->
    <div class="header-cta">
      <a href="/price-inquiry/" class="quote-button">
        Get a Quote
      </a>
    </div>

  </div>
</header>


<style>

  .site-header {
    background: #050A30;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
  }

  /* LOGO */

  .brand {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .brand img {
    width: auto;
    height: 58px;
    display: block;
  }


  /* NAVIGATION */

  .main-nav {
    flex: 1;
  }

  .main-nav > ul {
    margin: 0;
    padding: 0;
    list-style: none;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 4px;
  }

  .main-nav li {
    position: relative;
  }

  .main-nav a,
  .dropdown-toggle {
    display: block;
    padding: 12px 13px;

    color: #ffffff;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 500;

    background: none;
    border: none;
    cursor: pointer;

    transition: color .2s ease,
                background .2s ease;
  }

  .main-nav a:hover,
  .dropdown-toggle:hover {
    color: #69baff;
  }


  /* DROPDOWN */

  .dropdown-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dropdown-arrow {
    font-size: 13px;
  }

  .dropdown-menu {
    position: absolute;

    top: calc(100% + 8px);
    left: 0;

    width: 230px;

    background: #ffffff;

    border-radius: 8px;

    padding: 8px 0;

    box-shadow:
      0 15px 40px rgba(0,0,0,.22);

    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);

    transition:
      opacity .2s ease,
      transform .2s ease,
      visibility .2s ease;
  }

  .dropdown-menu a {
    color: #071227;

    padding: 12px 18px;

    font-size: 14px;
  }

  .dropdown-menu a:hover {
    background: #f3f7fb;
    color: #1769aa;
  }

  .nav-dropdown:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }


  /* QUOTE BUTTON */

  .header-cta {
    flex-shrink: 0;
  }

  .quote-button {
    display: inline-block;

    padding: 12px 19px;

    background: #ffffff;
    color: #071227;

    text-decoration: none;

    border-radius: 6px;

    font-size: 14px;
    font-weight: 700;

    transition: transform .2s ease,
                background .2s ease;
  }

  .quote-button:hover {
    background: #e8eef5;
    transform: translateY(-1px);
  }


  /* MOBILE MENU BUTTON */

  .hamburger-menu {
    display: none;

    width: 34px;
    height: 28px;

    background: none;
    border: none;

    padding: 0;

    cursor: pointer;
  }

  .hamburger-menu span {
    width: 100%;
    height: 3px;

    display: block;

    background: #ffffff;

    margin: 5px 0;

    border-radius: 3px;
  }


  /* TABLET */

  @media (max-width: 1100px) {

    .main-nav a,
    .dropdown-toggle {
      padding: 10px 8px;
      font-size: 14px;
    }

    .header-inner {
      gap: 12px;
    }

  }


  /* MOBILE */

  @media (max-width: 900px) {

    .site-header {
      position: sticky;
    }

    .header-inner {
      padding: 10px 20px;
    }

    .brand img {
      height: 50px;
    }

    .hamburger-menu {
      display: block;
      margin-left: auto;
    }

    .header-cta {
      display: none;
    }

    .main-nav {
      position: fixed;

      top: 70px;
      right: -100%;

      width: min(330px, 88vw);
      height: calc(100vh - 70px);

      background: #071227;

      padding: 25px;

      overflow-y: auto;

      transition: right .3s ease;

      box-shadow:
        -15px 20px 40px rgba(0,0,0,.35);
    }

    .main-nav.active {
      right: 0;
    }

    .main-nav > ul {
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
    }

    .main-nav a,
    .dropdown-toggle {
      width: 100%;

      box-sizing: border-box;

      text-align: left;

      padding: 14px 10px;

      font-size: 16px;
    }

    .dropdown-toggle {
      justify-content: space-between;
    }

    .dropdown-menu {
      position: static;

      width: 100%;

      background: #0c1b39;

      box-shadow: none;

      border-radius: 5px;

      display: none;

      opacity: 1;
      visibility: visible;
      transform: none;

      margin-bottom: 5px;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-menu a {
      color: #d8e4f2;

      padding-left: 25px;
    }

    .nav-dropdown:hover .dropdown-menu {
      display: none;
    }

    .nav-dropdown:hover .dropdown-menu.open {
      display: block;
    }

  }

</style>


<script>

  document.addEventListener('DOMContentLoaded', function () {

    const hamburger =
      document.querySelector('.hamburger-menu');

    const nav =
      document.querySelector('#main-nav');

    const dropdownToggle =
      document.querySelector('.dropdown-toggle');

    const dropdownMenu =
      document.querySelector('.dropdown-menu');


    /* MOBILE MENU */

    hamburger.addEventListener('click', function () {

      nav.classList.toggle('active');

      const isOpen =
        nav.classList.contains('active');

      hamburger.setAttribute(
        'aria-expanded',
        isOpen
      );

    });


    /* MOBILE SERVICES DROPDOWN */

    dropdownToggle.addEventListener(
      'click',
      function () {

        if (window.innerWidth <= 900) {
          dropdownMenu.classList.toggle('open');
        }

      }
    );


    /* CLOSE MENU AFTER CLICK */

    document
      .querySelectorAll('.main-nav a')
      .forEach(function(link) {

        link.addEventListener(
          'click',
          function () {

            nav.classList.remove('active');

            hamburger.setAttribute(
              'aria-expanded',
              'false'
            );

          }
        );

      });

  });

</script>
