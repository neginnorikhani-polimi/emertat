<!-- your_app/templates/base.html -->
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>
  {% block title %}
  Emertat Farabar | International Freight Forwarding in Iran
  {% endblock %}
</title>

<meta name="description"
      content="{% block meta_description %}Emertat Farabar provides international road, rail, sea and multimodal freight forwarding and customs clearance services in Iran.{% endblock %}">

<meta name="robots" content="index, follow">

<link rel="canonical"
      href="https://www.emertatfarabar.com{{ request.path }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Emertat Farabar">

<meta property="og:title"
      content="{% block og_title %}Emertat Farabar | International Freight Forwarding in Iran{% endblock %}">

<meta property="og:description"
      content="{% block og_description %}International road, rail, sea and multimodal freight forwarding solutions connecting Iran with regional and international markets.{% endblock %}">

<meta property="og:url"
      content="https://www.emertatfarabar.com{{ request.path }}">

<meta property="og:image"
      content="https://www.emertatfarabar.com{% static 'info/images/logo2.png' %}">

<!-- Twitter / Social Preview -->
<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:title"
      content="{% block twitter_title %}Emertat Farabar | International Freight Forwarding in Iran{% endblock %}">

<meta name="twitter:description"
      content="{% block twitter_description %}International freight forwarding and logistics solutions in Iran.{% endblock %}">

<!-- Favicon -->
<link rel="icon"
      type="image/png"
      href="{% static 'info/images/logo2.png' %}">
  <style id="global-mobile-fixes">

  /* Prevent horizontal overflow everywhere */
  html,
  body {
    max-width: 100%;
    overflow-x: hidden;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }


  @media (max-width: 700px) {

    /* -------------------------
       GLOBAL TYPOGRAPHY
    ------------------------- */

    body {
      font-size: 16px;
    }

    .section-header,
    .service-container,
    .about-container,
    .team-container,
    .contact-container,
    .quote-container,
    .lane-container {
      width: 100%;
      max-width: 100%;
    }

    .section-header h2,
    .service-section h2,
    .about-section h2,
    .team-section h2,
    .contact-section h2,
    .quote-intro h2,
    .lane-section h2 {
      font-size: 30px !important;
      line-height: 1.15 !important;
    }

    .section-header p,
    .service-intro,
    .about-text,
    .team-intro,
    .contact-intro,
    .lane-intro {
      font-size: 16px !important;
      line-height: 1.65 !important;
    }


    /* -------------------------
       HEADER
    ------------------------- */

    .site-header {
      width: 100%;
    }

    .header-inner {
      min-height: 72px;
      padding: 9px 20px !important;
    }

    .brand img {
      height: 44px !important;
      max-width: 230px;
      object-fit: contain;
    }

    .hamburger-menu {
      width: 31px;
    }

    /*
      Full-screen width menu instead of leaving
      part of the website visible on the left
    */
    .main-nav {
      top: 72px !important;
      right: -100vw !important;
      width: 100vw !important;
      height: calc(100dvh - 72px) !important;
      padding: 25px 28px !important;
      box-sizing: border-box;
    }

    .main-nav.active {
      right: 0 !important;
    }

    .main-nav a,
    .dropdown-toggle {
      font-size: 17px !important;
      padding: 13px 10px !important;
    }

    .dropdown-menu {
      width: 100% !important;
    }


    /* -------------------------
       HOME HERO
    ------------------------- */

    .hero {
      min-height: auto !important;
      padding: 58px 24px 60px !important;
    }

    .hero-content {
      max-width: 100% !important;
    }

    .hero-eyebrow {
      font-size: 12px !important;
      letter-spacing: 1.6px !important;
      margin-bottom: 16px !important;
    }

    .hero h1 {
      font-size: 39px !important;
      line-height: 1.05 !important;
      letter-spacing: -1px;
      margin-bottom: 23px !important;
    }

    .hero-lead {
      font-size: 18px !important;
      line-height: 1.55 !important;
    }

    .hero-description {
      font-size: 15px !important;
      line-height: 1.65 !important;
      margin-bottom: 28px !important;
    }

    .hero-actions {
      flex-direction: column;
      width: 100%;
      gap: 12px !important;
    }

    .hero-actions .btn {
      width: 100%;
      text-align: center;
      padding: 14px 16px;
    }


    /* -------------------------
       ALL HOME GRIDS
    ------------------------- */

    .trust-grid,
    .services-grid,
    .why-grid,
    .network-grid,
    .cargo-grid,
    .trade-lanes-grid,
    .clients-grid,
    .freight-options-grid,
    .experience-grid,
    .operations-grid,
    .services-about-grid,
    .approach-grid,
    .team-grid,
    .leadership-grid,
    .contact-grid,
    .social-grid,
    .support-grid,
    .benefits-grid,
    .integration-grid,
    .modes-grid,
    .capabilities-grid,
    .process-grid,
    .ports-grid,
    .network-points,
    .two-column-grid {
      grid-template-columns: 1fr !important;
      width: 100% !important;
    }


    /* -------------------------
       SECTION SPACING
    ------------------------- */

    .services-section,
    .why-section,
    .network-section,
    .cargo-section,
    .trade-lanes-section,
    .clients-section,
    .freight-options-section,
    .about-preview,
    .quote-cta-section,
    .service-section,
    .about-section,
    .team-section,
    .contact-section,
    .quote-section,
    .lane-section {
      padding: 55px 24px !important;
    }


    /* -------------------------
       CARDS
    ------------------------- */

    .service-card,
    .why-card,
    .network-card,
    .cargo-card,
    .client-card,
    .freight-option-card,
    .experience-card,
    .operation-card,
    .approach-card,
    .team-card,
    .leadership-card,
    .contact-card,
    .social-card,
    .support-card,
    .benefit-card,
    .integration-card,
    .mode-card,
    .capability-card,
    .port-card,
    .process-step {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      min-height: auto !important;
    }

    .service-card {
      padding: 25px !important;
      min-height: auto !important;
    }

    .service-card h3 {
      font-size: 22px !important;
    }

    .service-card p {
      font-size: 16px !important;
    }


    /* -------------------------
       WHY SECTION
    ------------------------- */

    .why-grid {
      gap: 16px !important;
    }

    .why-card {
      padding: 24px !important;
    }

    .why-card h3 {
      font-size: 21px !important;
    }

    .why-card p {
      font-size: 16px !important;
      line-height: 1.65 !important;
    }


    /* -------------------------
       OPERATIONAL NETWORK
    ------------------------- */

    .network-grid {
      gap: 15px !important;
    }

    .network-card {
      padding: 24px !important;
    }

    .network-cta .btn {
      display: block;
      width: 100%;
      text-align: center;
    }


    /* -------------------------
       CARGO
    ------------------------- */

    .cargo-grid {
      gap: 15px !important;
    }

    .cargo-card {
      padding: 24px !important;
    }


    /* -------------------------
       TRADE LANES
    ------------------------- */

    .trade-lane-group {
      width: 100% !important;
      padding: 23px !important;
    }

    .route-item {
      width: 100%;
    }

    .route-item strong {
      font-size: 16px;
    }


    /* -------------------------
       FREIGHT OPTIONS
    ------------------------- */

    .freight-option-card {
      padding: 25px !important;
    }

    .freight-option-card h3 {
      font-size: 34px !important;
    }


    /* -------------------------
       SERVICE PAGE HEROES
    ------------------------- */

    .service-hero,
    .about-hero,
    .team-hero,
    .contact-hero,
    .quote-hero,
    .lane-hero {
      padding: 60px 24px !important;
    }

    .service-hero h1,
    .about-hero h1,
    .team-hero h1,
    .contact-hero h1,
    .quote-hero h1,
    .lane-hero h1 {
      font-size: 38px !important;
      line-height: 1.08 !important;
    }

    .service-hero p,
    .about-hero p,
    .team-hero p,
    .contact-hero p,
    .quote-hero p,
    .lane-hero p {
      font-size: 17px !important;
      line-height: 1.6 !important;
    }


    /* -------------------------
       FORMS
    ------------------------- */

    .quote-form {
      padding: 22px !important;
    }

    .form-grid {
      grid-template-columns: 1fr !important;
    }

    .form-group,
    .form-group.full-width {
      grid-column: auto !important;
      width: 100%;
    }


    /* -------------------------
       FINAL CTA
    ------------------------- */

    .quote-cta-content h2,
    .road-cta h2,
    .sea-cta h2,
    .rail-cta h2,
    .multimodal-cta h2,
    .customs-cta h2,
    .about-cta h2,
    .team-cta h2,
    .contact-cta h2 {
      font-size: 30px !important;
    }


    /* -------------------------
       FOOTER
    ------------------------- */

    .footer-main {
      grid-template-columns: 1fr !important;
      padding: 45px 24px 35px !important;
      gap: 30px !important;
    }

    .footer-brand {
      grid-column: auto !important;
    }

    .footer-bottom {
      padding: 20px 24px !important;
      flex-direction: column;
    }

  }

</style>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #FFFFFF;
    }
    
    /* A small global utility to ensure images scale well on mobile */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  {% include "partials/header.html" %}
  
  <div class="content">
    {% block content %}{% endblock content %}
  </div>
</body>
</html>
